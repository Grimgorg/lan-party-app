<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#3d2e1d"/>
      <stop offset="1" stop-color="#120e0a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27f"/>
      <stop offset="0.55" stop-color="#d9ac52"/>
      <stop offset="1" stop-color="#9c7431"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="0.5" stop-color="#c9ccd2"/>
      <stop offset="1" stop-color="#7f858e"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8352a"/>
      <stop offset="1" stop-color="#5c1812"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <g id="sword">
      <!-- blade, tip up -->
      <path d="M512 150 L544 214 L544 640 L480 640 L480 214 Z" fill="url(#blade)"/>
      <path d="M512 170 L512 630" stroke="#8a9099" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
      <!-- crossguard -->
      <rect x="392" y="636" width="240" height="44" rx="22" fill="url(#gold)"/>
      <!-- grip -->
      <rect x="490" y="680" width="44" height="128" rx="10" fill="#5b3a20"/>
      <path d="M490 712 H534 M490 744 H534 M490 776 H534" stroke="#3b2414" stroke-width="7"/>
      <!-- pommel -->
      <circle cx="512" cy="836" r="34" fill="url(#gold)"/>
    </g>
  </defs>

  <!-- tile -->
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#bg)"/>
  <rect x="68" y="68" width="888" height="888" rx="190" fill="none" stroke="url(#gold)" stroke-width="18"/>

  <!-- crossed swords -->
  <g filter="url(#shadow)">
    <use href="#sword" transform="rotate(45 512 512)"/>
    <use href="#sword" transform="rotate(-45 512 512)"/>
  </g>

  <!-- shield -->
  <g filter="url(#shadow)">
    <path d="M352 360 H672 V556 C672 684 598 766 512 812 C426 766 352 684 352 556 Z"
          fill="url(#shield)" stroke="url(#gold)" stroke-width="22" stroke-linejoin="round"/>
    <!-- LAN network: three linked nodes -->
    <g stroke="url(#gold)" stroke-width="18" stroke-linecap="round">
      <path d="M512 462 L442 612 M512 462 L582 612 M442 612 L582 612"/>
    </g>
    <g fill="url(#gold)">
      <circle cx="512" cy="462" r="38"/>
      <circle cx="442" cy="612" r="38"/>
      <circle cx="582" cy="612" r="38"/>
    </g>
  </g>
</svg>
